<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Builds &#183; The tools behind the work.">
  <!-- backdrop -->
  <rect width="1280" height="480" fill="#eef2f6"/>
  <rect y="0" width="1280" height="8" fill="#1e2d42"/>
  <rect y="472" width="1280" height="8" fill="#1e2d42"/>

  <!-- hairline frame -->
  <rect x="40" y="44" width="1200" height="392" fill="none" stroke="#d5dfe8" stroke-width="2"/>

  <!-- left: label, headline, lede -->
  <text x="88" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="17" letter-spacing="3" fill="#4a6a8f">BUILDS &#183; WORKING TOOLS</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="72" letter-spacing="-2" fill="#1e2d42">
    <text x="84" y="184">The tools behind</text>
    <text x="84" y="256">the work.</text>
  </g>

  <text x="88" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#4a6a8f">Tools I built to run my own work,</text>
  <text x="88" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#4a6a8f">and apps I make for fun.</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="1.5" fill="#1e2d42">
    <rect x="88" y="362" width="292" height="34" rx="17" fill="#ffffff" stroke="#d5dfe8" stroke-width="1.5"/>
    <text x="234" y="384" text-anchor="middle">THE CMS BEHIND THIS SITE</text>
    <rect x="392" y="362" width="208" height="34" rx="17" fill="#ffffff" stroke="#d5dfe8" stroke-width="1.5"/>
    <text x="496" y="384" text-anchor="middle">OPEN LOOPS BOARD</text>
    <rect x="612" y="362" width="178" height="34" rx="17" fill="#ffffff" stroke="#d5dfe8" stroke-width="1.5"/>
    <text x="701" y="384" text-anchor="middle">CLAUDE SKILLS</text>
  </g>

  <!-- right: typographic index -->
  <line x1="920" y1="80" x2="920" y2="400" stroke="#d5dfe8" stroke-width="2"/>
  <text x="956" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="17" letter-spacing="3" fill="#4a6a8f">INDEX</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="17" fill="#1e2d42">
    <text x="956" y="162">The CMS behind this site</text>
    <text x="956" y="188" font-weight="400" font-size="15" fill="#4a6a8f">3 sites &#183; 1 admin &#183; 0 build step</text>

    <text x="956" y="232">Open Loops Board</text>
    <text x="956" y="258" font-weight="400" font-size="15" fill="#4a6a8f">In daily use since September</text>

    <text x="956" y="302">Claude Skills</text>
    <text x="956" y="328" font-weight="400" font-size="15" fill="#4a6a8f">12 skills &#183; 4 sets &#183; open source</text>
  </g>
</svg>
